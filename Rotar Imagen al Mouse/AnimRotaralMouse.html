<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Rotate to Mouse</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <canvas id="canvas" width="1000" height="1000"></canvas>
    <aside>Move mouse on canvas element.</aside>
    
    <script src="utils.js"></script>
    <!-- <script src="./classes/arrow.js"></script> -->
    <script>
    window.onload = function () {
      var canvas = document.getElementById('canvas'),
          context = canvas.getContext('2d'),
          mouse = utils.captureMouse(canvas),
          monociclo = new Image();
          monociclo.src = "monociclo.jpg";
          rueda = new Image();
          rueda.src = "rueda_monociclo.png";
        
      (function drawFrame () {
        window.requestAnimationFrame(drawFrame, canvas);
        context.clearRect(0, 0, canvas.width, canvas.height);

        context.drawImage(monociclo, 125, 125 , 750, 750);

        context.save();
        var x = canvas.width / 2;//coordenadas donde quieres que este posicionada la imagen en x, puedes poner un número
        var y = 680; 

        context.translate(x, y); //coordenadas donde quieres que aparezca tu imagen
        var dx = mouse.x - x,
            dy = mouse.y - y;
        
        var radianes = Math.atan2(dy, dx); //radians
        console.log(radianes);
        context.rotate(radianes); //radians
        context.drawImage(rueda, -rueda.width/2, -rueda.height/2);
        context.restore();
      }());
    };
    </script>

    <ol>
          <li><a href="../index.html">Regresar al Menú</a></li>
      </ol> 
  </body>
</html>
