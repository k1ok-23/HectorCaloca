<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Pulse</title>
    <link rel="stylesheet" href="style.css">
  </head>  
  <body>
    <canvas id="canvas" width="1100" height="1400"></canvas>
    
    <script src="utils.js"></script>
    <script src="Planet.js"></script>
    <script>
    window.onload = function () {
      var canvas = document.getElementById('canvas'),
          context = canvas.getContext('2d'),
          planet = new Planet(),
          angle = 0,
          centerScale = 1,
          range = 0.5,
          centerX = canvas.width / 2,
          centerY = canvas.height / 2,
          radiusX = 150,
          radiusY = 100,
          speed = 0.05;
        
      (function drawFrame () {
        window.requestAnimationFrame(drawFrame, canvas);
        context.clearRect(0, 0, canvas.width, canvas.height);

        planet.x = centerX + Math.sin(angle) * radiusX;
        planet.y = centerY + Math.cos(angle) * radiusY;

        planet.scaleX = planet.scaleY = centerScale + Math.sin(angle) * range;
   
        planet.draw(context);
        angle += speed;
      }());
    };
    </script>

    <ol>
          <li><a href="../index.html">Regresar al Menú</a></li>
      </ol> 
  </body>
</html>
