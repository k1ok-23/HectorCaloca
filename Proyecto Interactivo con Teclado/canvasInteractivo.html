<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Canvas Interactivo</title>
    <style>
      body { 
        background-color:darkolivegreen;
        color: beige;
        font-size: large;
      }
      canvas {
        background-color:peachpuff;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="1000" height="800"></canvas>
    <aside>Press arrow keys and/or A, B, C, D, E.</aside>

    <script src="keycode.js"></script>
    <script>
    window.onload = function () {
      var canvas = document.getElementById("canvas");
      var context = canvas.getContext("2d");
      var x = 200;
      var y = 200;
      context.font = '40pt Calibri';
      context.fillStyle = 'purple';
      context.fillText('Animals!', x, y); //<== para poner texto en el canvas

      var alligator= new Image(); // variable para guardar la imagen
      alligator.src = "alligator.jpg"; // fuente de donde toma la imagen
      alligator.onload = function(){
        context.drawImage(alligator, x, y+50, 200, 200); //<== para poner imagen en el canvas
      };
      
      var bear= new Image(); // variable para guardar la imagen
      bear.src = "bear.jpg"; // fuente de donde toma la imagen
      bear.onload = function(){
        context.drawImage(bear, x, y+50, 200, 200); //<== para poner imagen en el canvas
      };

      var cat= new Image(); // variable para guardar la imagen
      cat.src = "cat.jpg"; // fuente de donde toma la imagen
      cat.onload = function(){
        context.drawImage(cat, x, y+50, 200, 200); //<== para poner imagen en el canvas
      };

      var duck= new Image(); // variable para guardar la imagen
      duck.src = "duck.png"; // fuente de donde toma la imagen
      duck.onload = function(){
        context.drawImage(duck, x, y+50, 200, 200); //<== para poner imagen en el canvas
      };

      var eagle= new Image(); // variable para guardar la imagen
      eagle.src = "eagle.jpg"; // fuente de donde toma la imagen
      eagle.onload = function(){
        context.drawImage(eagle, x, y+50, 200, 200); //<== para poner imagen en el canvas
      };

      context.fillRect(x,y,100,100);
      
      function onKeyboardEvent (event) {
        switch (event.keyCode) {
         case keycode.UP:
          console.log("up!");
          context.clearRect(0, 0, innerWidth, innerHeight);
          y-=5;
          context.fillRect(x,y,100,100);
          break;
        case keycode.DOWN:
          console.log("down!");
          context.clearRect(0, 0, innerWidth, innerHeight);
          y+=5;
          context.fillRect(x,y,100,100);
          break;
        case keycode.LEFT:
          console.log("left!");
          context.clearRect(0, 0, innerWidth, innerHeight);
          x-=5;
          context.fillRect(x,y,100,100);
          break;
        case keycode.RIGHT:
          console.log("right!");
          context.clearRect(0, 0, innerWidth, innerHeight);
          x+=5;
          context.fillRect(x,y,100,100);
          break;
        case keycode.SPACE:
          console.log("Jump!");
          break;
        case keycode.A:
          console.log("Letra A");
          context.clearRect(0, 0, innerWidth, innerHeight);
          context.fillText('ALLIGATOR', x, y);
          context.drawImage(alligator, x, y+50, 200, 200);
          break;
        case keycode.B:
          console.log("Letra B");
          context.clearRect(0, 0, innerWidth, innerHeight);
          context.fillText('BEAR', x, y);
          context.drawImage(bear, x, y+50, 200, 200);
          break;
        case keycode.C:
          console.log("Letra C");
          context.clearRect(0, 0, innerWidth, innerHeight);
          context.fillText('CAT', x, y);
          context.drawImage(cat, x, y+50, 200, 200);
          break;
        case keycode.D:
          console.log("Letra D");
          context.clearRect(0, 0, innerWidth, innerHeight);
          context.fillText('DUCK', x, y);
          context.drawImage(duck, x, y+50, 200, 200);
          break;
        case keycode.E:
          console.log("Letra E");
          context.clearRect(0, 0, innerWidth, innerHeight);
          context.fillText('EAGLE', x, y);
          context.drawImage(eagle, x, y+50, 200, 200);
          break;
        case keycode.F:
          console.log("Letra F");
          break;
        case keycode.G:
          console.log("Letra G");
          break;
        case keycode.H:
          console.log("Letra H");
          break;
        case keycode.I:
          console.log("Letra I");
          break;
        case keycode.J:
          console.log("Letra J");
          break;
        case keycode.K:
          console.log("Letra K");
          break;
        case keycode.L:
          console.log("Letra L");
          break;
        case keycode.M:
          console.log("Letra M");
          break;
        case keycode.N:
          console.log("Letra N");
          break;
        case keycode.O:
          console.log("Letra O");
          break;
        case keycode.P:
          console.log("Letra P");
          break;
        case keycode.Q:
          console.log("Letra Q");
          break;
        case keycode.R:
          console.log("Letra R");
          break;
        case keycode.S:
          console.log("Letra S");
          break;
        case keycode.T:
          console.log("Letra T");
          break;
        case keycode.U:
          console.log("Letra U");
          break;
        case keycode.V:
          console.log("Letra V");
          break;
        case keycode.W:
          console.log("Letra W");
          break;
        case keycode.Y:
          console.log("Letra Y");
          break;
        case keycode.X:
          console.log("Letra X");
          break;
        case keycode.Z:
          console.log("Letra Z");
          break;

        default:
          console.log(event.keyCode);
        }
      }

      window.addEventListener('keydown', onKeyboardEvent, false);
    };
    </script>

      <ol>
          <li><a href="../index.html">Regresar al Menú</a></li>
      </ol> 
  </body>
</html>
